name: 🔄 Sync Upstream (brew & homebrew-core)

on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create sync branch
        run: git checkout -b sync/upstream-${{ github.run_number }}

      - name: Subtree pull brew
        id: brew
        run: |
          set -e
          BEFORE=$(git rev-parse HEAD)
          git subtree pull --prefix=brew https://github.com/Homebrew/brew master --squash -m "chore: sync brew upstream"
          AFTER=$(git rev-parse HEAD)
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Subtree pull homebrew-core
        id: hbcore
        run: |
          set -e
          BEFORE=$(git rev-parse HEAD)
          git subtree pull --prefix=homebrew-core https://github.com/Homebrew/homebrew-core main --squash -m "chore: sync homebrew-core upstream"
          AFTER=$(git rev-parse HEAD)
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Push sync branch
        if: steps.brew.outputs.changed == 'true' || steps.hbcore.outputs.changed == 'true'
        run: git push origin sync/upstream-${{ github.run_number }}

      - name: Open pull request
        if: steps.brew.outputs.changed == 'true' || steps.hbcore.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const brewChanged = '${{ steps.brew.outputs.changed }}' === 'true';
            const coreChanged = '${{ steps.hbcore.outputs.changed }}' === 'true';
            const parts = [];
            if (brewChanged) parts.push('- `brew/` synced from Homebrew/brew');
            if (coreChanged) parts.push('- `homebrew-core/` synced from Homebrew/homebrew-core');
            await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔄 Sync upstream: brew & homebrew-core',
              head: `sync/upstream-${{ github.run_number }}`,
              base: 'main',
              body: `## Upstream sync\n\n${parts.join('\n')}\n\nโปรดรีวิวก่อน merge (auto-generated by sync-upstream.yml)`
            });

      - name: No changes
        if: steps.brew.outputs.changed == 'false' && steps.hbcore.outputs.changed == 'false'
        run: echo "No upstream changes to sync."
